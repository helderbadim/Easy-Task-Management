@if (isAddingTask) {
  <app-new-task [userId]="userId" (close)="onCloseAddingTask()" />
}
<section id="tasks">
  <header>
    <h2>{{ name }} tasks</h2>
    <menu>
      <button (click)="startAddingTask()">Add Task</button>
    </menu>
  </header>
  <ul>
    @for (task of selectedUserTasks; track task.id) {
    <li> <app-task [task]="task"/></li>
    }
  </ul>
</section>
